<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seed Audio 音频创作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="tool-page">
  <header class="page-head">
    <div>
      <h1>Seed Audio 音频创作</h1>
      <p>旁白、对话与场景音效，使用你的火山方舟额度。</p>
    </div>
    <span class="mode-badge">音频</span>
  </header>

  <section class="card settings">
    <div class="settings-title-row">
      <label for="key">火山方舟 API 密钥</label>
      <a href="https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey" target="_blank" rel="noopener noreferrer" class="link-btn">获取 API Key ↗</a>
    </div>
    <div class="row">
      <input type="password" id="key" autocomplete="off" placeholder="输入火山方舟 API Key，安全保存在系统凭据库">
      <button id="save-key">保存密钥</button>
      <button id="clear-key" class="secondary">清除密钥</button>
    </div>
    <p id="key-status" role="status">正在检查密钥状态…</p>
  </section>

  <div class="tool-grid">
    <section class="card composer">
      <div class="section-head">
        <div><h2>创作参数</h2><p>描述人物、语气或环境声音。</p></div>
      </div>
      <div class="form-group">
        <label for="prompt">音频描述</label>
        <textarea id="prompt" placeholder="例如：一位年轻女性用温和、亲切的语气播报：“欢迎来到轻作创作中心”。"></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="format">音频格式</label>
          <select id="format">
            <option value="mp3" selected>MP3 · 通用</option>
            <option value="wav">WAV · 无损</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sample-rate">采样率</label>
          <select id="sample-rate">
            <option value="48000" selected>48,000 Hz · 工作室</option>
            <option value="24000">24,000 Hz · 标准</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="speech-rate">语速</label>
          <select id="speech-rate">
            <option value="0" selected>正常</option>
            <option value="20">稍快 +20%</option>
            <option value="50">快速 +50%</option>
            <option value="-20">稍慢 -20%</option>
            <option value="-50">慢速 -50%</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pitch-rate">音调</label>
          <select id="pitch-rate">
            <option value="0" selected>正常</option>
            <option value="20">偏高 +20%</option>
            <option value="-20">偏低 -20%</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="run">开始创作</button>
        <button id="cancel" class="secondary" disabled>取消</button>
        <button id="save-audio" class="secondary" disabled>保存音频</button>
      </div>
      <p id="status" role="status">配置密钥并输入描述后开始创作。</p>
    </section>

    <section class="card preview-card">
      <div class="section-head"><div><h2>试听</h2><p>结果保留在当前会话中。</p></div></div>
      <div class="audio-player-box">
        <audio id="audio-result" controls hidden></audio>
        <div id="preview-placeholder" class="preview-placeholder"><span class="preview-mark" aria-hidden="true">♪</span><strong>还没有音频</strong><span>创作完成后在这里试听</span></div>
      </div>
    </section>
  </div>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
